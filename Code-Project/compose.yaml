services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flip-and-match
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    restart: unless-stopped

volumes:
  node_modules: